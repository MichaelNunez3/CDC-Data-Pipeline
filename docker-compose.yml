services:

  kafka:

    image: apache/kafka:3.9.0

    container_name: kafka

    ports:
    
      - "9092:9092"
      - "29092:29092"

    environment:

      # Kafka KRaft configuration
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # Kafka listeners
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # Controller configuration
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # Single-broker configuration
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # Create topics automatically
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      # Faster startup for a single broker
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    volumes:
      - kafka_data:/var/lib/kafka/data


  connect_SQLServer_CDC:

    image: quay.io/debezium/connect:3.0

    container_name: debezium_connect

    depends_on:
      - kafka

    ports:
      - "8083:8083"

    environment:

      # Local Kafka broker
      BOOTSTRAP_SERVERS: kafka:9092

      # Kafka Connect worker group
      GROUP_ID: "1"

      # Kafka Connect internal topics
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_status

      # Single Kafka broker
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"

      # JSON converters
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter

      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"

      # Local Kafka uses PLAINTEXT
      CONNECT_SECURITY_PROTOCOL: PLAINTEXT

      # Producer connects to local Kafka
      CONNECT_PRODUCER_SECURITY_PROTOCOL: PLAINTEXT

      # Consumer connects to local Kafka
      CONNECT_CONSUMER_SECURITY_PROTOCOL: PLAINTEXT


volumes:

  kafka_data: